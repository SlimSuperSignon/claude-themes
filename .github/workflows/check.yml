name: Check themes

# Every theme is checked on a pull request, and the index is rebuilt whenever
# main changes, so it always matches the themes folder.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check every theme
        if: github.event_name == 'pull_request'
        run: node scripts/build-index.mjs --check

      - name: Rebuild the index
        if: github.event_name == 'push'
        run: |
          node scripts/build-index.mjs
          if [ -n "$(git status --porcelain index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Rebuild index [skip ci]"
            git push
          fi
